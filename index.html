<title>Lembra Tudo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">

<style>
/* Layout: one column phone-first, sticky summary on top, list grouped by urgency, add form as a bottom sheet */
:root{
  color-scheme:light;
  --yellow:#F7E7A6; --green:#CDEBD4; --purple:#DCCFF5; --blue:#CFE6F7;
  --bg:#FAF6EE; --surface:#FFFFFF; --ink:#343A46; --muted:#787B84; --line:#ECE4D6;
  --accent:#D8CBF4; --accent-ink:#2E2650; --accent-strong:#6E56B8;
  --late:#B5564F; --soon:#8C6A12; --ok:#3A7D58;
  --late-bg:#FBE3DF; --soon-bg:#FAEDB9; --ok-bg:#D6EFDC;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--yellow);display:grid;place-items:center;color:var(--accent-ink);font:800 20px var(--display)}
h1{font:700 26px/1 var(--display);margin:0;letter-spacing:-.01em}
.tag{color:var(--muted);font-size:13px;margin:2px 0 0}
.badge{background:none;cursor:pointer;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.summary{margin-top:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px rgba(52,55,74,.04);border-radius:14px;padding:12px}
.stat{min-width:0}.stat b{display:block;font:600 clamp(17px,5.2vw,24px)/1.1 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--muted)}
.stat.late b{color:var(--late)} .stat.money b{color:var(--ink)}
.hint{margin-top:12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hint button{font:600 13px var(--body);background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;padding:0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 6px}
.chip{font:500 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h2{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:24px 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:var(--bg)}
.item h3{margin:0;font:600 15px var(--body);overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted)}
.when{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.late{background:var(--late-bg);color:var(--late)} .pill.soon{background:var(--soon-bg);color:var(--soon)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.acts button{font:500 12px var(--body);background:none;border:0;color:var(--muted);cursor:pointer;padding:0;text-decoration:underline}
.ex{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:2px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 20px;font:700 15px var(--body);box-shadow:0 6px 20px rgba(110,86,184,.22);cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgba(40,36,60,.28);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));max-height:90%;overflow:auto}
.sheet h2{margin:0 0 12px;font:800 20px var(--display);text-transform:none;letter-spacing:0;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
input,select{font:400 15px var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.btn{font:600 15px var(--body);border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--late)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.alerts{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.alerts p{margin:0;font-size:13px;color:var(--muted)}
.alerts .btns{display:flex;gap:8px;flex-wrap:wrap}
.alerts .btn{font-size:14px;padding:8px 12px}
.alerts .on{color:var(--ok);font-weight:600}
.paytext{color:var(--muted);margin:0 0 14px}
.buy{display:block;text-align:center;text-decoration:none;margin-bottom:16px}
.payerr{color:var(--late);font-size:13px;margin:8px 0 0}
.quick{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.quick h3,.fquick h3{margin:0;font:600 13px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.preset{font:500 14px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.preset.add{border-style:dashed;color:var(--muted);background:none}
.preset .x{font-size:12px;color:var(--muted);padding:0 2px}
.newpreset{display:flex;gap:6px}
.newpreset input{flex:1}
.fquick{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.voice{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.mic{font:600 14px var(--body);border-radius:999px;padding:9px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.mic[aria-pressed="true"]{background:var(--late-bg);border-color:var(--late);color:var(--late)}
.voice small{color:var(--muted);font-size:13px;flex:1;min-width:0}
.alertpick{display:flex;gap:6px;flex-wrap:wrap}
.alertpick label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--ink);font-size:13px;cursor:pointer;background:var(--bg)}
.alertpick input{width:auto;padding:0;margin:0}
.alertpick label:has(input:checked){border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.alertpick label:has(input:disabled:not(:checked)){opacity:.45;cursor:not-allowed}
.foot{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:420px){.grid{grid-template-columns:1fr}}

.presets>:nth-child(4n+1){background:var(--yellow);border-color:transparent}
.presets>:nth-child(4n+2){background:var(--green);border-color:transparent}
.presets>:nth-child(4n+3){background:var(--purple);border-color:transparent}
.presets>:nth-child(4n+4){background:var(--blue);border-color:transparent}
.presets>.add{background:none!important;border-color:var(--line)!important}
.stat:nth-child(2){background:var(--yellow);border-color:transparent}
.stat:nth-child(3){background:var(--green);border-color:transparent}
.chip[aria-pressed="true"]{background:var(--blue)!important;color:var(--ink)!important;border-color:var(--blue)!important}
.ico{background:var(--blue)}
.lang{font:600 12px var(--body);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 8px;background:var(--surface);width:auto;cursor:pointer}
.tools{display:flex;gap:8px;align-items:center}
:lang(zh) body,:lang(zh) h1{font-family:"Figtree","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">L</div>
      <div><h1>Lembra Tudo</h1><p class="tag" data-i18n="tag"></p></div>
    </div>
    <div class="tools">
      <select class="lang" id="langSel" aria-label="Idioma / Language / 语言">
        <option value="pt">PT · Português</option>
        <option value="es">ES · Español</option>
        <option value="en">EN · English</option>
        <option value="zh">中文</option>
      </select>
      <button type="button" class="badge" id="planBadge"></button>
    </div>
  </header>

  <section class="summary" data-i18n-aria="summary">
    <div class="stat late"><b id="sLate">0</b><span data-i18n="sumLate"></span></div>
    <div class="stat"><b id="sSoon">0</b><span data-i18n="sumSoon"></span></div>
    <div class="stat money"><b id="sMoney">0</b><span data-i18n="sumMoney"></span></div>
  </section>

  <div class="hint" id="hint" hidden>
    <span data-i18n="exHint"></span>
    <button id="clearEx" type="button" data-i18n="exClear"></button>
  </div>

  <section class="alerts">
    <p id="alertText"></p>
    <div class="btns">
      <button type="button" class="btn primary" id="notifBtn" data-i18n="notifBtn"></button>
      <button type="button" class="btn" id="icsBtn" data-i18n="icsBtn"></button>
    </div>
    <p id="iosTip" hidden data-i18n="iosTip"></p>
  </section>

  <section class="quick">
    <h3 data-i18n="quickTitle"></h3>
    <div class="presets" id="mainPresets"></div>
  </section>

  <nav class="filters" id="filters"></nav>
  <main id="groups"></main>

  <p class="foot" data-i18n="foot"></p>
</div>

<button class="fab" id="addBtn" type="button" data-i18n="add"></button>

<div class="sheet-bg" id="payBg" hidden>
  <form class="sheet" id="payForm" aria-labelledby="payTitle">
    <h2 id="payTitle" data-i18n="payTitle"></h2>
    <p class="paytext" id="payText"></p>
    <a class="btn primary buy" id="buyLink" href="#" target="_blank" rel="noopener" hidden data-i18n="buy"></a>
    <label><span data-i18n="payLabel"></span><input id="payCode" autocomplete="off" autocapitalize="characters" placeholder="LT-XXXX-XXXX-XXXX"></label>
    <p class="payerr" id="payErr" hidden data-i18n="payErr"></p>
    <div class="row"><button type="button" class="btn" id="payClose" data-i18n="notNow"></button><button type="submit" class="btn primary" data-i18n="activate"></button></div>
  </form>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <form class="sheet" id="form" aria-labelledby="formTitle">
    <h2 id="formTitle"></h2>
    <div class="voice" id="voiceRow">
      <button type="button" class="mic" id="micBtn" aria-pressed="false"></button>
      <small id="voiceText"></small>
    </div>
    <div class="fquick" id="formQuick">
      <h3 data-i18n="quickForm"></h3>
      <div class="presets" id="formPresets"></div>
      <div class="newpreset" id="newPresetRow" hidden>
        <input id="newPresetName" maxlength="30" data-i18n-ph="newPresetPh">
        <button type="button" class="btn" id="newPresetSave" data-i18n="create"></button>
      </div>
    </div>
    <div class="grid">
      <label class="full"><span id="fNameLabel"></span><input id="fName" required></label>
      <label><span data-i18n="lblType"></span><select id="fType"></select></label>
      <label><span id="fDateLabel"></span><input id="fDate" type="date" required></label>
      <label class="apptOnly" hidden><span data-i18n="lblTime"></span><input id="fTime" type="time" value="09:00"></label>
      <label><span data-i18n="lblCost"></span><input id="fCost" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></label>
      <label><span data-i18n="lblRepeat"></span><select id="fRepeat">
        <option value="none" data-i18n="repNone"></option>
        <option value="week" data-i18n="repWeek"></option>
        <option value="month" data-i18n="repMonth"></option>
        <option value="year" data-i18n="repYear"></option>
      </select></label>
      <div class="full apptOnly" hidden>
        <label style="margin-bottom:6px" data-i18n="lblAlerts"></label>
        <div class="alertpick" id="fAlerts"></div>
      </div>
      <label class="full notAppt"><span data-i18n="lblWarn"></span><select id="fWarn">
        <option value="3"></option><option value="7" selected></option><option value="30"></option><option value="90"></option>
      </select></label>
    </div>
    <div class="row">
      <button type="button" class="btn danger" id="delBtn" hidden data-i18n="del"></button>
      <span style="flex:1"></span>
      <button type="button" class="btn" id="cancelBtn" data-i18n="cancel"></button>
      <button type="submit" class="btn primary" data-i18n="save"></button>
    </div>
  </form>
</div>

const LKEY="lembra-tudo-idioma";
function detectLang(){let s=null;try{s=localStorage.getItem(LKEY)}catch(e){}
  if(s&&I18N[s])return s;
  for(const l of (navigator.languages||[navigator.language||"pt"])){const p=String(l).slice(0,2).toLowerCase();if(I18N[p])return p}
  return"en"}
let LANG=detectLang();let L=I18N[LANG];
// Moeda pelo país do aparelho; se não der para saber, pela língua
const CUR_BY_REGION={BR:"BRL",PT:"EUR",ES:"EUR",MX:"MXN",AR:"ARS",CO:"COP",CL:"CLP",PE:"PEN",UY:"UYU",US:"USD",GB:"GBP",CA:"CAD",AU:"AUD",CN:"CNY",TW:"TWD",HK:"HKD",SG:"SGD"};
const CUR_BY_LANG={pt:"BRL",es:"USD",en:"USD",zh:"CNY"};
function currency(){const tag=(navigator.languages||[navigator.language||""]).find(l=>String(l).slice(0,2).toLowerCase()===LANG)||"";
  const reg=(tag.split("-")[1]||"").toUpperCase();return CUR_BY_REGION[reg]||CUR_BY_LANG[LANG]}
let CUR=currency();
const fmtMoney=v=>{try{return v.toLocaleString(L.locale,{style:"currency",currency:CUR})}catch(e){return v.toFixed(2)}};

const ALERT_MIN={h1:60,d0:null,d1:1440,d2:2880,d7:10080};

const savePresets=()=>{try{localStorage.setItem(PKEY,JSON.stringify(customPresets))}catch(e){}};
const isAppt=it=>it.type==="appt";
function alertTimes(it){const start=new Date(it.date+"T"+(it.time||"09:00")+":00");
  return (it.alerts||[]).map(k=>{if(k==="d0"){const t=new Date(start);t.setHours(8,0,0,0);return{k,at:t>start?start:t}}
    return{k,at:new Date(start.getTime()-(ALERT_MIN[k]||0)*60000)}})}
const apptWarnDays=it=>Math.max(0,...(it.alerts||[]).map(k=>k==="d0"||k==="h1"?0:Math.ceil(ALERT_MIN[k]/1440)));
const KEY="lembra-tudo-v1";
const DAY=86400000;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const plus=n=>iso(new Date(today().getTime()+n*DAY));

const FREE_LIMIT=3;

let active=false;try{active=localStorage.getItem("lembra-tudo-ativo")==="1"}catch(e){}
async function codeOk(c){c=c.trim().toUpperCase().replace(/\s+/g,"");if(!c)return false;
  try{const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(c));
    const hex=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");return CODE_HASHES.includes(hex)}catch(e){return false}}
function activate(){active=true;try{localStorage.setItem("lembra-tudo-ativo","1")}catch(e){}updatePlan()}
function updatePlan(){const used=(items||[]).filter(i=>!i.example).length;
  planBadge.textContent=active?L.planFull:L.planFree(Math.min(used,FREE_LIMIT),FREE_LIMIT)}
function openPay(msg){payText.textContent=msg||L.payText;
  payErr.hidden=true;payCode.value="";buyLink.hidden=!BUY_URL;if(BUY_URL)buyLink.href=BUY_URL;payBg.hidden=false}
try{items=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(items))items=samples();
function idb(mode,fn){return new Promise((res,rej)=>{try{const o=indexedDB.open("lembra-tudo",1);
  o.onupgradeneeded=()=>o.result.createObjectStore("kv");o.onerror=()=>rej(o.error);
  o.onsuccess=()=>{const tx=o.result.transaction("kv",mode);const r=fn(tx.objectStore("kv"));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)}}catch(e){rej(e)}})}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}
  idb("readwrite",s=>s.put(items,"items")).catch(()=>{})};

const daysLeft=it=>Math.round((new Date(it.date+"T00:00:00")-today())/DAY);
function status(it){const d=daysLeft(it);
  if(isAppt(it)){const start=new Date(it.date+"T"+(it.time||"09:00")+":00");if(start<new Date())return"late";return d<=Math.max(apptWarnDays(it),1)?"soon":"ok"}
  if(d<0)return"late";if(d<=Math.max(it.warn,0))return"soon";return"ok"}
function label(d){if(d<0)return L.dueAgo(-d);if(d===0)return L.dueToday;if(d===1)return L.tomorrow;if(d<60)return L.inDays(d);return L.inMonths(Math.round(d/30))}
const fmtDate=s=>new Date(s+"T00:00:00").toLocaleDateString(L.locale,{day:"2-digit",month:"short",year:"numeric"});
const fmtTime=t=>{const [h,m]=(t||"09:00").split(":").map(Number);const d=new Date();d.setHours(h,m,0,0);
  return LANG==="en"?d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}):(t||"09:00")};
function apptLabel(it){const d=daysLeft(it),t=fmtTime(it.time);
  if(status(it)==="late")return d===0?L.apptWasToday(t):L.apptAgo(-d);
  if(d===0)return L.apptToday(t);if(d===1)return L.apptTomorrow(t);
  const wd=new Date(it.date+"T00:00:00").toLocaleDateString(L.locale,{weekday:"short"}).replace(".","");
  return d<7?L.apptWd(wd,t):L.inDays(d)}
function renew(it){const d=new Date(it.date+"T00:00:00");if(it.repeat==="week")d.setDate(d.getDate()+7);else if(it.repeat==="month")d.setMonth(d.getMonth()+1);else if(it.repeat==="year")d.setFullYear(d.getFullYear()+1);it.date=iso(d)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(){
  const late=items.filter(i=>status(i)==="late").length;
  const soon=items.filter(i=>{const d=daysLeft(i);return d>=0&&d<=30&&status(i)!=="late"}).length;
  const money=items.filter(i=>i.type==="sub"&&i.repeat==="month").reduce((s,i)=>s+(+i.cost||0),0)
            +items.filter(i=>i.type==="sub"&&i.repeat==="year").reduce((s,i)=>s+(+i.cost||0)/12,0);
  sLate.textContent=late;sSoon.textContent=soon;sMoney.textContent=fmtMoney(money);
  hint.hidden=!items.some(i=>i.example);
  const counts={all:items.length};items.forEach(i=>counts[i.type]=(counts[i.type]||0)+1);
  filters.innerHTML=[["all",L.all],...TYPE_KEYS.filter(k=>counts[k]).map(k=>[k,L.types[k]])]
    .map(([k,l])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${filter===k}">${l} · ${counts[k]||0}</button>`).join("");
  const list=items.filter(i=>filter==="all"||i.type===filter).sort((a,b)=>daysLeft(a)-daysLeft(b));
  if(!list.length){groups.innerHTML=`<div class="empty"><p><b>${L.emptyTitle}</b></p><p>${L.emptyText}</p></div>`;updatePlan();return}
  const sections=[["late",L.secLate],["soon",L.secSoon],["ok",L.secOk]];
  groups.innerHTML=sections.map(([s,title])=>{
    const rows=list.filter(i=>status(i)===s);if(!rows.length)return"";
    return`<h2>${title}</h2><div class="list">${rows.map(it=>{const d=daysLeft(it),tl=L.types[it.type]||L.types.other,appt=isAppt(it);
      const rep=it.repeat&&it.repeat!=="none"?" · "+L.repShort[it.repeat]:"";
      const cost=+it.cost?` · ${fmtMoney(+it.cost)}`:"";
      return`<article class="item"><div class="ico" aria-hidden="true">${ICONS[it.type]||ICONS.other}</div>
        <div><h3>${esc(it.name)}${it.example?`<span class="ex">${L.example}</span>`:""}</h3><div class="meta">${tl} · ${fmtDate(it.date)}${appt?" · "+fmtTime(it.time):""}${cost}${rep}${appt&&it.alerts?.length?" · "+L.nAlerts(it.alerts.length):""}</div></div>
        <div class="when"><span class="pill ${s}">${appt?apptLabel(it):label(d)}</span><div class="acts">
          ${it.repeat&&it.repeat!=="none"?`<button type="button" data-renew="${it.id}">${appt?L.next:L.renew}</button>`:""}
          <button type="button" data-edit="${it.id}">${L.edit}</button></div></div></article>`}).join("")}</div>`}).join("");
  updatePlan();
}

  if((x=t.match(/后天/))){d=new Date(base.getTime()+2*DAY);cut(x[0])}
  else if((x=t.match(/明天|明日/))){d=new Date(base.getTime()+DAY);cut(x[0])}
  else if((x=t.match(/今天|今日|今晚/))){d=base;cut(x[0])}
  if(!d&&(x=t.match(/(?:下|这|本)?(?:周|星期|礼拜)([1-6日天])/))){const k=x[1];d=nextWeekday(k==="日"||k==="天"?0:+k);cut(x[0])}
  if(!d&&(x=t.match(/(\d{1,2})月(\d{1,2})[日号]?/))){d=dayMonth(+x[2],+x[1]-1);cut(x[0])}
  if(!d&&(x=t.match(/(\d{1,2})[日号]/))){d=dayOnly(+x[1]);cut(x[0])}
  if(d)out.date=iso(d);
  let name=pickName(t,rest,null);
  if(!name){name=rest.replace(/提醒我|帮我|预约|安排|记得|要|去|在|的|有|和/g,"").trim()}
  if(name)out.name=name;
  return out}
};
const parseVoice=s=>PARSERS[LANG](s);

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function micIdle(){micBtn.setAttribute("aria-pressed","false");micBtn.textContent=L.mic;rec=null}
if(!SR)micBtn.hidden=true;
micBtn.onclick=()=>{
  if(rec){rec.stop();return}
  rec=new SR();rec.lang=L.speech;rec.interimResults=true;rec.maxAlternatives=1;
  micBtn.setAttribute("aria-pressed","true");micBtn.textContent=L.micStop;voiceText.textContent=L.listening;
  let final="";
  rec.onresult=e=>{let txt="";for(const r of e.results)txt+=r[0].transcript;voiceText.textContent="“"+txt+"”";if(e.results[e.results.length-1].isFinal)final=txt};
  rec.onerror=e=>{voiceText.textContent=e.error==="not-allowed"?L.voiceBlocked:L.voiceRetry};
  rec.onend=()=>{micIdle();if(!final)return;const r=parseVoice(final);
    fType.value="appt";syncTypeUI();if(r.name)fName.value=r.name;if(r.date)fDate.value=r.date;if(r.time)fTime.value=r.time;
    voiceText.textContent=L.voiceDone(final)};
  try{rec.start()}catch(e){voiceText.textContent=L.voiceFail;micIdle()}
};

/* ================= Aplicar idioma ================= */
let alertState="intro";
function applyLang(){
  L=I18N[LANG];CUR=currency();document.documentElement.lang=L.locale;langSel.value=LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=L[el.dataset.i18n]});
  if(L.buyHtml)buyLink.innerHTML=L.buyHtml;
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{el.placeholder=L[el.dataset.i18nPh]});
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{el.setAttribute("aria-label",L[el.dataset.i18nAria])});
  fType.innerHTML=TYPE_KEYS.map(k=>`<option value="${k}">${L.types[k]}</option>`).join("");
  const keepAl=getAlerts();
  fAlerts.innerHTML=Object.keys(ALERT_MIN).map(k=>`<label><input type="checkbox" id="al-${k}" value="${k}">${L.alerts[k]}</label>`).join("");
  setAlerts(keepAl);
  [...fWarn.options].forEach(o=>o.textContent=L.warnN(o.value));
  micBtn.textContent=L.mic;
  refreshAlertUI();renderPresets();render();
  if(!sheetBg.hidden)syncTypeUI();
  idb("readwrite",s=>s.put(LANG,"lang")).catch(()=>{});
}
langSel.addEventListener("change",()=>{LANG=langSel.value;try{localStorage.setItem(LKEY,LANG)}catch(e){}
  // Exemplos acompanham o idioma escolhido
  if(items.some(i=>i.example)){const mine=items.filter(i=>!i.example);L=I18N[LANG];items=[...mine,...samples()];save()}
  applyLang()});

payBg.addEventListener("click",e=>{if(e.target===payBg)payBg.hidden=true});

/* ---------- Avisos no celular ---------- */
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
let swReg=null;
const canNotify="Notification" in window&&"serviceWorker" in navigator;
function refreshAlertUI(){
  if(alertState==="activated"){alertText.textContent=L.activated;return}
  if(alertState==="icsDone"){alertText.textContent=L.icsDone;return}
  if(alertState==="icsNone"){alertText.textContent=L.icsNone;return}
  alertText.textContent=L.alertIntro;
  if(!canNotify){
    if(isIOS&&!standalone){iosTip.hidden=false;notifBtn.hidden=true;alertText.textContent=L.installFirst}
    else{notifBtn.hidden=true;alertText.textContent=L.noNotif}
    return}
  if(Notification.permission==="granted"){notifBtn.hidden=true;alertText.innerHTML=L.notifOn}
  else if(Notification.permission==="denied"){notifBtn.hidden=true;alertText.textContent=L.notifBlocked}
}
async function startSW(){
  if(!("serviceWorker" in navigator))return;
  try{swReg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;
    if(Notification.permission==="granted"){
      (swReg.active||navigator.serviceWorker.controller)?.postMessage("check");
      if("periodicSync" in swReg){try{await swReg.periodicSync.register("lembra-check",{minInterval:12*3600000})}catch(e){}}
    }}catch(e){}
}
notifBtn.onclick=async()=>{
  try{const p=await Notification.requestPermission();alertState="intro";refreshAlertUI();if(p==="granted"){await startSW()}}
  catch(e){alertText.textContent=L.notifFail}
};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&swReg&&Notification.permission==="granted")swReg.active?.postMessage("check")});

/* ---------- Exportar para o calendário (.ics com alarmes) ---------- */
function icsEscape(s){return String(s).replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n")}
function buildICS(list){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const RR={week:"RRULE:FREQ=WEEKLY\r\n",month:"RRULE:FREQ=MONTHLY\r\n",year:"RRULE:FREQ=YEARLY\r\n"};
  const ev=list.map(it=>{const rr=RR[it.repeat]||"";
    if(isAppt(it)){const st=it.date.replace(/-/g,"")+"T"+(it.time||"09:00").replace(":","")+"00";
      const start=new Date(it.date+"T"+(it.time||"09:00")+":00");const endD=new Date(start.getTime()+3600000);
      const en=iso(endD).replace(/-/g,"")+"T"+String(endD.getHours()).padStart(2,"0")+String(endD.getMinutes()).padStart(2,"0")+"00";
      const al=alertTimes(it).map(a=>{const mins=Math.max(0,Math.round((start-a.at)/60000));
        return`BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${icsEscape(it.name+" – "+L.alerts[a.k])}\r\nTRIGGER:-PT${mins}M\r\nEND:VALARM\r\n`}).join("");
      return`BEGIN:VEVENT\r\nUID:${it.id}@lembratudo\r\nDTSTAMP:${stamp}\r\nDTSTART:${st}\r\nDTEND:${en}\r\n${rr}SUMMARY:${icsEscape(it.name)}\r\nDESCRIPTION:${icsEscape(L.icsAppt)}\r\n${al}END:VEVENT\r\n`}
    const d=it.date.replace(/-/g,"");const end=iso(new Date(new Date(it.date+"T00:00:00").getTime()+DAY)).replace(/-/g,"");
    const cost=+it.cost?` (${fmtMoney(+it.cost)})`:"";
    return`BEGIN:VEVENT\r\nUID:${it.id}@lembratudo\r\nDTSTAMP:${stamp}\r\nDTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${end}\r\n${rr}SUMMARY:${icsEscape(L.icsDue(it.name+cost))}\r\nDESCRIPTION:${icsEscape(L.icsDesc(L.types[it.type]||L.types.other))}\r\n`+
      `BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${icsEscape(L.icsDueIn(it.name,it.warn))}\r\nTRIGGER:-P${Math.max(it.warn-1,0)}DT15H\r\nEND:VALARM\r\n`+
      `BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${icsEscape(L.icsDueToday(it.name))}\r\nTRIGGER:PT9H\r\nEND:VALARM\r\nEND:VEVENT\r\n`}).join("");
  return`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Lembra Tudo//${LANG.toUpperCase()}\r\nCALSCALE:GREGORIAN\r\nX-WR-CALNAME:Lembra Tudo\r\n${ev}END:VCALENDAR\r\n`}
icsBtn.onclick=()=>{
  const list=items.filter(i=>!i.example);
  if(!list.length){alertState="icsNone";refreshAlertUI();return}
  const url=URL.createObjectURL(new Blob([buildICS(list)],{type:"text/calendar"}));
  const a=document.createElement("a");a.href=url;a.download="lembra-tudo.ics";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  alertState="icsDone";refreshAlertUI();
};

/* ---------- Início ---------- */
applyLang();save();startSW();

(async()=>{const m=location.hash.match(/^#ativar-(.+)$/);if(!m)return;

  if(await codeOk(decodeURIComponent(m[1]))){activate();alertState="activated";refreshAlertUI()}
  else openPay(L.payBadLink)})();
